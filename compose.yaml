name: helium-bench

# Postgres holds the benchmark results (schema: db/schema.sql); Grafana reads
# them through the data source in grafana/provisioning/datasources.

services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: helium_bench
      POSTGRES_USER: ${POSTGRES_USER:-helium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helium}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty, i.e. on the first start.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # The dashboards use the proposal's colours, lightened for the dark theme.
      GF_USERS_DEFAULT_THEME: dark
      POSTGRES_USER: ${POSTGRES_USER:-helium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helium}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  pgadmin:
    image: dpage/pgadmin4:9.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Read only on the first start, i.e. while pgadmin-data is empty.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"

volumes:
  postgres-data:
  grafana-data:
  pgadmin-data:
