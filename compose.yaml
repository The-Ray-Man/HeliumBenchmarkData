name: helium-bench

# Grafana on top of DuckDB. Results live as Parquet files in ./data (layout in
# db/schema.sql); Grafana queries them through an in-memory DuckDB whose views
# are set up by grafana/provisioning/datasources/duckdb.yaml.

services:
  # One-shot: downloads the DuckDB data source plugin into the plugins volume.
  grafana-plugins:
    image: alpine:3.22
    environment:
      PLUGIN_ID: motherduck-duckdb-datasource
      PLUGIN_VERSION: 0.4.5
    command:
      - sh
      - -euc
      - |
        dir="/plugins/$${PLUGIN_ID}"
        if [ -f "$${dir}/.version" ] && [ "$$(cat "$${dir}/.version")" = "$${PLUGIN_VERSION}" ]; then
          echo "plugin $${PLUGIN_ID} $${PLUGIN_VERSION} already installed"; exit 0
        fi
        rm -rf "$${dir}"
        wget -qO /tmp/plugin.zip "https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v$${PLUGIN_VERSION}/$${PLUGIN_ID}-$${PLUGIN_VERSION}.zip"
        unzip -q /tmp/plugin.zip -d /plugins
        echo "$${PLUGIN_VERSION}" > "$${dir}/.version"
        echo "installed $${PLUGIN_ID} $${PLUGIN_VERSION}"
    volumes:
      - grafana-plugins:/plugins

  grafana:
    # The DuckDB plugin needs glibc, so the Ubuntu image (not the Alpine default).
    image: grafana/grafana:13.2.4-ubuntu
    depends_on:
      grafana-plugins:
        condition: service_completed_successfully
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: motherduck-duckdb-datasource
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-plugins:/var/lib/grafana/plugins
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  grafana-data:
  grafana-plugins:
