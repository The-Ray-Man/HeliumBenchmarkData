# The benchmark machine's GitHub Actions runner, next to Postgres and Grafana
# from compose.yaml. Used only on that machine:
#
#   docker compose -f compose.yaml -f compose.ci.yaml up -d
#
# Settings come from `.env` next to this file (git-ignored), see README.

services:
  gh-runner:
    build: ./ci-runner
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 24G
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNER_URL: ${RUNNER_URL:-https://github.com/viperproject/helium}
      RUNNER_NAME: bench
      RUNNER_LABELS: bench
      # Only needed for the first start, which registers the runner.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # The restricted role from db/bench_ci_role.sql.
      DATABASE_URL: ${DATABASE_URL}
      # Build cache of the runner crate (Helium's is helium.target_dir in suite.ci.json).
      CARGO_TARGET_DIR: /opt/bench/runner-target
    volumes:
      - runner-home:/home/runner/actions-runner
      - runner-work:/home/runner/_work
      - cargo-registry:/home/runner/.cargo/registry
      - cargo-git:/home/runner/.cargo/git
      - /local/home/rawick/Documents/helium:/opt/bench/helium
      - /local/home/rawick/Documents/HeliumBenchmark/runner:/opt/bench/runner
      - /local/home/rawick/Documents/silicon:/opt/bench/silicon:ro
      - /local/home/rawick/Documents/HeliumBenchmark/suites:/opt/bench/suites
    cpuset: "4-20"
    networks:
      - net

volumes:
  runner-home:
  runner-work:
  cargo-registry:
  cargo-git:

networks:
  net:
    external: true
