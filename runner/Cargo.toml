[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.11.1"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "with-json",
    "with-chrono",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
