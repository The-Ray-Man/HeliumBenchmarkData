[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
num = "0.4.3"
peg = "0.8.5"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1.11.1"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "with-json",
    "with-chrono",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "rt"] }
log = "0.4.34"
env_logger = "0.11"
clap = { version = "4.6.7", features = ["derive", "env"] }
