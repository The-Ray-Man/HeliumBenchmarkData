apiVersion: 1

# GitHub's REST API through the Infinity plugin (installed by compose.yaml).
# Helium Stats reads the branches and pull requests of viperproject/helium with
# it. Unauthenticated, GitHub allows 60 requests per hour and IP; a dashboard
# refresh makes two. For more, create a fine-grained token with read access to
# public repositories and uncomment the auth settings below (Grafana expands
# $GITHUB_TOKEN from its environment, so add GITHUB_TOKEN to the grafana service
# in compose.yaml); an empty token makes GitHub reject every request.
datasources:
  - name: GitHub
    uid: helium-github
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      allowedHosts:
        - https://api.github.com
      # auth_method: bearerToken
    # secureJsonData:
    #   bearerToken: $GITHUB_TOKEN
