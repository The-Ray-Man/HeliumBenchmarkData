apiVersion: 1

# The results database of compose.yaml; credentials come from the container's
# environment.
datasources:
  - name: Postgres
    uid: helium-postgres
    type: grafana-postgresql-datasource
    access: proxy
    isDefault: true
    editable: false
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: helium_bench
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
