apiVersion: 1

# In-memory DuckDB; the init SQL exposes the Parquet files in /data (= ./data)
# as the tables of db/schema.sql (status columns cast back to the enum). Views
# re-read the files on every query, so new runs show up without a restart.
# Every table directory needs at least one file, so a run writes all five
# tables, even when one of them is empty; until then init fails and is retried
# on the next query.
datasources:
  - name: DuckDB
    uid: helium-duckdb
    type: motherduck-duckdb-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      path: ''
      initSql: |
        CREATE TYPE run_status AS ENUM
            ('VERIFIED', 'FAILED', 'INCONCLUSIVE', 'CRASHED', 'TIMED_OUT', 'SKIPPED');

        -- *_metrics: latest measurement per file; *_metrics_history: all of them
        CREATE VIEW rust_metrics_history AS
            SELECT * FROM read_parquet('/data/rust_metrics/*.parquet', union_by_name = true);
        CREATE VIEW rust_metrics AS
            SELECT * FROM rust_metrics_history
            QUALIFY row_number() OVER (PARTITION BY rs_sha256 ORDER BY measured_at DESC) = 1;
        CREATE VIEW viper_metrics_history AS
            SELECT * FROM read_parquet('/data/viper_metrics/*.parquet', union_by_name = true);
        CREATE VIEW viper_metrics AS
            SELECT * FROM viper_metrics_history
            QUALIFY row_number() OVER (PARTITION BY vpr_sha256 ORDER BY measured_at DESC) = 1;

        CREATE VIEW helium_runs AS
            SELECT * REPLACE (status::run_status AS status)
            FROM read_parquet('/data/helium_runs/*.parquet', union_by_name = true);
        CREATE VIEW silicon_runs AS
            SELECT * REPLACE (status::run_status AS status)
            FROM read_parquet('/data/silicon_runs/*.parquet', union_by_name = true);
        CREATE VIEW rustc_runs AS
            SELECT * REPLACE (status::run_status AS status)
            FROM read_parquet('/data/rustc_runs/*.parquet', union_by_name = true);
